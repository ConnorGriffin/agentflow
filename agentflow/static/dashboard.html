<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentflow</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e;
    --green:#3fb950; --blue:#58a6ff; --amber:#d29922; --red:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{display:flex;align-items:baseline;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border)}
  header h1{margin:0;font-size:18px;letter-spacing:.5px}
  header .sub{color:var(--muted);font-size:12px}
  main{max-width:960px;margin:0 auto;padding:24px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:24px 0 10px}
  .pools{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pool{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px}
  .pool .top{display:flex;justify-content:space-between;margin-bottom:8px}
  .bar{height:8px;background:#21262d;border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:4px}
  .repo{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
  .repo .name{font-weight:600}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid;margin-left:8px}
  .autonomous{color:var(--green);border-color:var(--green)}
  .reviewed{color:var(--blue);border-color:var(--blue)}
  .guarded{color:var(--amber);border-color:var(--amber)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px}
  .col h3{font-size:11px;text-transform:uppercase;color:var(--muted);margin:0 0 6px;letter-spacing:1px}
  .item{padding:4px 0;border-top:1px solid var(--border)}
  .item .n{color:var(--muted)}
  .empty{color:var(--muted);font-style:italic}
  .ratchet{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);
    display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted)}
  .loosen{color:var(--green);border:1px solid var(--green);border-radius:20px;padding:1px 8px}
  .tool-claude{color:var(--amber)} .tool-codex{color:var(--blue)}
</style>
</head>
<body>
<header>
  <h1>agentflow</h1>
  <span class="sub" id="updated">loading…</span>
</header>
<main>
  <h2>Pools · rate-limit headroom</h2>
  <div class="pools" id="pools"></div>
  <h2>Fleet</h2>
  <div id="fleet"></div>
</main>
<script>
const pct = v => Math.max(0, Math.min(100, v));
const color = h => h > 40 ? 'var(--green)' : h > 15 ? 'var(--amber)' : 'var(--red)';

function poolCard(p){
  const h = pct(p.headroom_pct);
  return `<div class="pool">
    <div class="top"><b class="tool-${p.tool}">${p.tool}</b>
      <span>${h}% headroom ${p.clear ? '' : '· busy'}</span></div>
    <div class="bar"><i style="width:${h}%;background:${color(h)}"></i></div></div>`;
}

function list(items, render){
  return items.length ? items.map(render).join('') : '<div class="empty">none</div>';
}

function repoCard(r){
  const rt = r.ratchet || {};
  return `<div class="repo">
    <div><span class="name">${r.repo}</span>
      <span class="badge ${r.profile}">${r.profile}</span></div>
    <div class="row">
      <div class="col"><h3>In flight</h3>${list(r.in_flight, p =>
        `<div class="item"><span class="n">#${p.number}</span> ${p.title}
          <span class="tool-${p.builder}">· ${p.builder}</span></div>`)}</div>
      <div class="col"><h3>Recently merged</h3>${list(r.recent_merges, p =>
        `<div class="item"><span class="n">#${p.number}</span> ${p.title}</div>`)}</div>
    </div>
    <div class="ratchet">
      <span>ratchet: ${rt.samples||0} samples · ${Math.round((rt.correction_rate||0)*100)}% corrected</span>
      ${rt.ready_to_loosen ? '<span class="loosen">ready to loosen</span>' : ''}
    </div></div>`;
}

async function refresh(){
  try{
    const s = await (await fetch('/api/snapshot')).json();
    document.getElementById('pools').innerHTML = s.pools.map(poolCard).join('');
    document.getElementById('fleet').innerHTML = s.repos.map(repoCard).join('');
    document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
  }catch(e){ document.getElementById('updated').textContent = 'error: ' + e; }
}
refresh(); setInterval(refresh, 15000);
</script>
</body>
</html>
