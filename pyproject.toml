[project]
name = "agentflow"
version = "0.0.1"
description = "Tool-agnostic autonomous issue → PR → review pipeline (runs on Claude or Codex)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
agentflow-web = "agentflow.webapp:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
