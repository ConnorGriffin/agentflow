name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether Python validation is required
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]] || ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- . ':(exclude)agentflow/webui/**'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only console files changed; skipping Python validation."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false
      - if: steps.changes.outputs.run == 'true'
        run: uv sync --frozen --group dev
      - if: steps.changes.outputs.run == 'true'
        run: uv run pytest -q
      - if: steps.changes.outputs.run == 'true'
        run: uv run python scripts/audit-public-tree.py
      - if: steps.changes.outputs.run == 'true'
        run: uv run python scripts/check-public-doc-links.py

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify DCO sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-dco.py "$BASE_SHA" "$HEAD_SHA"

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agentflow/webui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine whether console validation is required
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]] || ! git -C "$GITHUB_WORKSPACE" diff --quiet "$BASE_SHA" "$HEAD_SHA" -- agentflow/webui .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No console files changed; skipping console validation."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - if: steps.changes.outputs.run == 'true'
        run: npm ci
      - if: steps.changes.outputs.run == 'true'
        run: npm test
      - if: steps.changes.outputs.run == 'true'
        run: npm run build
      - if: steps.changes.outputs.run == 'true'
        name: Verify tracked console build
        run: git diff --exit-code -- dist
